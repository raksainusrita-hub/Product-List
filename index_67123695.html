<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product List</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1c1c1c, #2e2e2e);
      color: #fbe8ba;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 30px;
      color: hwb(39 74% 0%);
      text-shadow: 0 0 15px rgba(250, 234, 180, 0.8);
    }

    .status {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.1rem;
      color: #cccccc;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
      gap: 50px;
    }

    .product-card {
      background: rgba(90, 0, 0, 0.905);
      border-radius: 30px;
      padding: 12px;
      box-shadow: 0 8px 24px rgb(182, 175, 129);
      backdrop-filter: blur(6px);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .product-card:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 32px rgba(255, 206, 109, 0.749);
    }

    .product-name {
      font-weight: 600;
      font-size: 1.2rem;
      margin-bottom: 30px;
    }

    .product-type {
      font-size: 1rem;
      color: #ddd;
      margin-bottom: 12px;
    }

    .product-price {
      font-size: 1.2rem;
      font-weight: 600;
      color: #ffd700;
      text-shadow: 0 0 6px rgba(255,215,0,0.7);
    }
  </style>
</head>
<body>
  <h1>🛍️ Product List 🛍️</h1>
  <div id="status" class="status">Loading...</div>

  <div class="product-grid" id="product-grid"></div>

  <script>
    const url = 'https://mdn.github.io/learning-area/javascript/apis/fetching-data/can-store/products.json';
    const statusEl = document.getElementById('status');
    const grid = document.getElementById('product-grid');

    async function loadProducts() {
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('HTTP error: ' + response.status);

        const products = await response.json();

        products.forEach(p => {
          const card = document.createElement('div');
          card.className = 'product-card';

          const nameDiv = document.createElement('div');
          nameDiv.className = 'product-name';
          nameDiv.textContent = p.name;

          const typeDiv = document.createElement('div');
          typeDiv.className = 'product-type';
          typeDiv.textContent = p.type;

          const priceDiv = document.createElement('div');
          priceDiv.className = 'product-price';
          priceDiv.textContent = '£' + p.price;

          card.appendChild(nameDiv);
          card.appendChild(typeDiv);
          card.appendChild(priceDiv);

          grid.appendChild(card);
        });

        statusEl.textContent = 'Completed ✨';
      } catch (err) {
        statusEl.textContent = 'Failed to load products: ' + err.message;
        statusEl.style.color = '#ff6b6b';
      }
    }

    loadProducts();
  </script>
</body>
</html>
